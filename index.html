<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sadece İkimiz İçin ❤️</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --bg-dark: #140718;
            --bg-purple: #2a0e36;
            --ruby: #e11d48;
            --ruby-glow: rgba(225, 29, 72, 0.45);
            --glass: rgba(36, 12, 46, 0.72);
            --text-light: #fdf2f8;
            --text-muted: #e9d5ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at top right, #3b0d2c, var(--bg-purple), var(--bg-dark));
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
        }

        /* Kilit Ekranı */
        #lock-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(145deg, #16061b 0%, #380b28 50%, #1d0926 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #lock-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .lock-box {
            background: var(--glass);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(225, 29, 72, 0.4);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 25px var(--ruby-glow);
            padding: 35px 25px;
            border-radius: 24px;
            width: 100%;
            max-width: 360px;
        }

        .heart-icon {
            font-size: 46px;
            color: var(--ruby);
            margin-bottom: 12px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .lock-title {
            font-family: 'Dancing Script', cursive;
            font-size: 34px;
            margin-bottom: 8px;
            color: #fff;
        }

        .lock-sub {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 22px;
        }

        .pin-input {
            width: 100%;
            padding: 14px;
            font-size: 22px;
            letter-spacing: 8px;
            text-align: center;
            background: rgba(20, 7, 24, 0.8);
            border: 1.5px solid rgba(225, 29, 72, 0.5);
            border-radius: 14px;
            color: #fff;
            outline: none;
            margin-bottom: 16px;
            transition: border-color 0.3s;
        }

        .pin-input:focus {
            border-color: var(--ruby);
            box-shadow: 0 0 15px var(--ruby-glow);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #be123c, var(--ruby));
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 20px var(--ruby-glow);
            transition: transform 0.2s;
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        #error-msg {
            color: #fda4af;
            font-size: 12px;
            margin-top: 10px;
            min-height: 18px;
        }

        /* Ana İçerik */
        #main-content {
            width: 100%;
            max-width: 460px;
            padding: 20px 16px 60px;
            display: none;
            flex-direction: column;
            gap: 24px;
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(225, 29, 72, 0.3);
            border-radius: 22px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .hero-img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 16px;
            border: 2px solid rgba(225, 29, 72, 0.5);
            margin-bottom: 14px;
        }

        .section-title {
            font-family: 'Dancing Script', cursive;
            font-size: 32px;
            text-align: center;
            color: #fff;
            margin-bottom: 6px;
            text-shadow: 0 2px 10px var(--ruby-glow);
        }

        .section-desc {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        /* Sayaç */
        .counter-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .counter-box {
            background: rgba(20, 7, 24, 0.75);
            border: 1px solid rgba(225, 29, 72, 0.4);
            border-radius: 14px;
            padding: 12px 4px;
            text-align: center;
        }

        .counter-num {
            font-size: 20px;
            font-weight: 600;
            color: #fb7185;
            display: block;
        }

        .counter-label {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Galeri Slider */
        .slider-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 16px;
        }

        .slides {
            display: flex;
            transition: transform 0.4s ease-in-out;
        }

        .slide {
            min-width: 100%;
            position: relative;
        }

        .slide img {
            width: 100%;
            height: 360px;
            object-fit: cover;
            border-radius: 16px;
            border: 1.5px solid rgba(225, 29, 72, 0.4);
        }

        .slide-caption {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 10px;
            font-style: italic;
        }

        .slider-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }

        .nav-btn {
            background: rgba(225, 29, 72, 0.25);
            border: 1px solid var(--ruby);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-indicator {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Mektup */
        .portrait-img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--ruby);
            display: block;
            margin: 0 auto 14px;
            box-shadow: 0 0 20px var(--ruby-glow);
        }

        .letter-text {
            font-size: 14px;
            line-height: 1.75;
            color: #fce7f3;
            background: rgba(20, 7, 24, 0.6);
            padding: 18px;
            border-radius: 16px;
            border-left: 3px solid var(--ruby);
        }

        .letter-text p {
            margin-bottom: 12px;
        }

        .letter-text p:last-child {
            margin-bottom: 0;
        }

        /* Teklif Bölümü */
        .proposal-card {
            text-align: center;
            border: 1.5px solid var(--ruby);
            box-shadow: 0 0 25px var(--ruby-glow);
            position: relative;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .proposal-question {
            font-family: 'Dancing Script', cursive;
            font-size: 32px;
            color: #fff;
            margin-bottom: 24px;
        }

        .proposal-btns {
            display: flex;
            justify-content: center;
            gap: 16px;
            position: relative;
            height: 50px;
        }

        .btn-yes {
            padding: 12px 32px;
            background: linear-gradient(135deg, #be123c, var(--ruby));
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 5px 15px var(--ruby-glow);
            z-index: 2;
        }

        .btn-no {
            padding: 12px 28px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.25s ease;
            z-index: 3;
        }

        #accepted-msg {
            display: none;
            margin-top: 16px;
            font-size: 16px;
            font-weight: 500;
            color: #fda4af;
